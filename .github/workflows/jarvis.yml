name: Jarvis APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Project banao
        run: |
          D=japp/app/src/main/java/com/jarvis/app
          mkdir -p $D
          cp src/*.kt $D/
          rm -f $D/MainActivity.kt
          cd japp
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Jarvis'
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx3g
          EOF
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.jarvis.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.jarvis.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'com.alphacephei:vosk-android:0.3.47'
              implementation 'net.java.dev.jna:jna:5.13.0@aar'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <queries>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
              </queries>
              <application android:label="Jarvis" android:allowBackup="false" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".JarvisActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          if [ -f ../src/AndroidManifest.xml ]; then cp ../src/AndroidManifest.xml app/src/main/AndroidManifest.xml; fi
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/jarvis_access.xml << 'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:notificationTimeout="200"/>
          EOF
          S='<service android:name=".JarvisAccess" android:exported="true" android:label="Jarvis" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/jarvis_access"/></service>'
          sed -i "s#</application>#${S}</application>#" app/src/main/AndroidManifest.xml
          mkdir -p app/src/main/assets
          if curl -fsSL -o /tmp/m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip; then
            unzip -q /tmp/m.zip -d /tmp/mdl && mv /tmp/mdl/vosk-model-small-en-in-0.4 app/src/main/assets/model-en-in && echo jarvis-model-1 > app/src/main/assets/model-en-in/uuid
          fi
      - name: APK banao
        working-directory: japp
        run: gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-v2-${{ github.run_number }}
          name: Jarvis v2 build ${{ github.run_number }}
          files: japp/app/build/outputs/apk/debug/app-debug.apk
