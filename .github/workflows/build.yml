name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip3 install --user --upgrade buildozer cython virtualenv

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:$HOME/.local/bin
        buildozer init
        # Yahan maine basic setting daali hai
        sed -i 's/#android.permissions = INTERNET/android.permissions = INTERNET,RECORD_AUDIO/' buildozer.spec
        sed -i 's/#title = My Application/title = Maya Assistant/' buildozer.spec
        sed -i 's/#package.name = myapp/package.name = mayaapp/' buildozer.spec
        sed -i 's/#package.domain = org.test/package.domain = org.tilak/' buildozer.spec
        sed -i 's/#source.dir = ./source.dir = ./' buildozer.spec
        sed -i 's/#requirements = python3,kivy/requirements = python3,kivy,pyjnius/' buildozer.spec
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: maya-apk
        path: bin/*.apk
